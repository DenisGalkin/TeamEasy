<!DOCTYPE html>f
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamEasy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="sidebar">
    <div class="logo">
        <a href="{{ url_for('index') }}" style="text-decoration: none; color: inherit;">
            <h1>TeamEasy</h1>
        </a>
    </div>
    <div class="nav-links">
        <a href="{{ url_for('home') }}" class="nav-link {% if request.endpoint == 'home' %}active{% endif %}">
            <span>Главная</span>
        </a>

        <a href="{{ url_for('search_projects') }}"
           class="nav-link {% if request.endpoint == 'search_projects' %}active{% endif %}">
            <span>Поиск</span>
        </a>

        <a href="{{ url_for('my_projects') }}"
           class="nav-link {% if request.endpoint == 'my_projects' %}active{% endif %}">
            <span>Мои проекты</span>
        </a>

        <a href="{{ url_for('create_project') }}"
           class="nav-link {% if request.endpoint == 'create_project' %}active{% endif %}">
            <span>Создать проект</span>
        </a>

        <a href="{{ url_for('notifications') }}"
           class="nav-link {% if request.endpoint == 'notifications' %}active{% endif %}">
            <span>Уведомления</span>
        </a>

        <a href="{{ url_for('profile', username=current_user.username) }}"
           class="nav-link {% if request.endpoint == 'profile' %}active{% endif %}">
            <span>Профиль</span>
        </a>
    </div>

    <div style="padding: 0 1rem; margin-top: auto;">
        <a href="{{ url_for('logout') }}" class="nav-link" style="color: #dc3545;">
            <span>Выйти</span>
        </a>
    </div>
</nav>

<main class="main-content">
    <header class="top-bar">
        <div class="search-bar">
            <form method="GET" action="{{ url_for('search_projects') }}" style="display: flex; width: 100%;">
                <input type="text" name="q" placeholder="Поиск проектов и пользователей"
                       value="{{ request.args.get('q', '') }}" style="flex: 1;">
            </form>
        </div>
    </header>
    <div class="content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash-message flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</main>
</body>
</html>
